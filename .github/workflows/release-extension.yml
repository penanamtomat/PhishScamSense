name: Release Extension

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-rc.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build Chrome extension (zip)
        working-directory: extension
        run: npm run zip

      - name: Build Firefox extension (zip)
        working-directory: extension
        run: npm run zip:firefox

      - name: List output files
        run: ls -lh extension/.output/

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* || "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "prerelease_flag=--prerelease" >> $GITHUB_OUTPUT
            echo "label=🧪 Beta" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "prerelease_flag=" >> $GITHUB_OUTPUT
            echo "label=🚀 Stable" >> $GITHUB_OUTPUT
          fi

      - name: Initialize extension repo if empty
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO }}
        run: |
          # Check if the repo has any commits — if empty, push a README to initialize it
          HAS_COMMITS=$(gh api repos/penanamtomat/PhishScamSense-Extension \
            --jq '.size' 2>/dev/null || echo "0")

          if [ "$HAS_COMMITS" = "0" ]; then
            echo "Repo is empty, initializing with README..."
            git clone https://x-access-token:${{ secrets.EXTENSION_REPO }}@github.com/penanamtomat/PhishScamSense-Extension.git ext-repo
            cd ext-repo

            cat > README.md << 'READMEEOF'
          # PhishScamSense Extension

          Real-time phishing and scam URL detection for Chrome and Firefox.

          ## Install

          Go to the [**Releases**](../../releases) page and follow the instructions for your browser.

          ### Chrome / Edge / Brave / Opera
          1. Download `phishscamsense-*-chrome.zip`
          2. Unzip the file
          3. Go to `chrome://extensions` → enable **Developer mode**
          4. Click **Load unpacked** → select the unzipped folder

          ### Firefox
          1. Download `phishscamsense-*-firefox.zip`
          2. Go to `about:addons` → ⚙️ → **Install Add-on From File...**
          3. Select the zip file

          ## Source Code & Issues
          Main repository: [PhishScamSense](https://github.com/penanamtomat/PhishScamSense)
          READMEEOF

            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add README.md
            git commit -m "chore: initialize extension release repository"
            git push origin main
            cd ..
          else
            echo "Repo already initialized (size: $HAS_COMMITS KB)"
          fi

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release delete "$TAG" \
            --repo penanamtomat/PhishScamSense-Extension \
            --yes 2>/dev/null || true

      - name: Publish release to PhishScamSense-Extension
        env:
          GH_TOKEN: ${{ secrets.EXTENSION_REPO }}
        run: |
          TAG="${{ github.ref_name }}"
          LABEL="${{ steps.prerelease.outputs.label }}"
          PRERELEASE_FLAG="${{ steps.prerelease.outputs.prerelease_flag }}"

          gh release create "$TAG" \
            --repo penanamtomat/PhishScamSense-Extension \
            --title "PhishScamSense ${TAG}" \
            --notes "## ${LABEL} — PhishScamSense ${TAG}

          $([ '${{ steps.prerelease.outputs.is_prerelease }}' = 'true' ] && echo '> ⚠️ This is a **beta release** — expect bugs. Please report issues [here](https://github.com/penanamtomat/PhishScamSense/issues).' || echo '> ✅ Stable release.')

          ---

          ## Install Instructions

          ### Chrome / Edge / Brave / Opera
          1. Download \`phishscamsense-*-chrome.zip\` below
          2. Unzip the file anywhere on your computer
          3. Open your browser → go to \`chrome://extensions\` (or \`edge://extensions\`)
          4. Enable **Developer mode** toggle (top-right corner)
          5. Click **Load unpacked** → select the unzipped folder
          6. ✅ PhishScamSense icon will appear in your toolbar

          > Chrome will show a \"Developer mode\" notice on startup — this is expected for extensions not on the Web Store.

          ### Firefox
          1. Download \`phishscamsense-*-firefox.zip\` below
          2. Open Firefox → go to \`about:addons\`
          3. Click the ⚙️ gear icon → **Install Add-on From File...**
          4. Select the downloaded zip file
          5. ✅ Done!

          ---

          ### Issues or false positives?
          Report them at the [main repository](https://github.com/penanamtomat/PhishScamSense/issues)." \
            $PRERELEASE_FLAG \
            extension/.output/*.zip
