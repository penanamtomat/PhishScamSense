<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhishScamSense - Blocked</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0f;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 480px;
        width: 100%;
        padding: 2.5rem 2rem;
        text-align: center;
      }

      /* Animated shield icon */
      .shield {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        box-shadow: 0 0 40px rgba(220, 38, 38, 0.3);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.3); }
        50% { box-shadow: 0 0 60px rgba(220, 38, 38, 0.5); }
      }

      /* Threat badge */
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
      }
      .badge-phishing { background: #7f1d1d; color: #fca5a5; }
      .badge-malware  { background: #713f12; color: #fde68a; }
      .badge-spam     { background: #1e3a5f; color: #93c5fd; }
      .badge-default  { background: #3f3f46; color: #d4d4d8; }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #f87171;
        margin-bottom: 0.75rem;
      }

      .description {
        color: #94a3b8;
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      /* Details card */
      .details {
        background: #111118;
        border: 1px solid #1e1e2e;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
        text-align: left;
        font-size: 0.8rem;
      }
      .details-row {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem 0;
        border-bottom: 1px solid #1e1e2e;
      }
      .details-row:last-child { border-bottom: none; }
      .details-label { color: #64748b; }
      .details-value {
        color: #cbd5e1;
        max-width: 280px;
        word-break: break-all;
        text-align: right;
      }

      /* Confidence bar */
      .confidence-bar-bg {
        width: 100%;
        height: 6px;
        background: #1e1e2e;
        border-radius: 3px;
        margin-top: 0.5rem;
        overflow: hidden;
      }
      .confidence-bar {
        height: 100%;
        border-radius: 3px;
        transition: width 0.6s ease;
      }
      .confidence-high { background: linear-gradient(90deg, #ef4444, #dc2626); }
      .confidence-mid  { background: linear-gradient(90deg, #f59e0b, #d97706); }
      .confidence-low  { background: linear-gradient(90deg, #22c55e, #16a34a); }

      /* Buttons */
      .buttons { display: flex; flex-direction: column; gap: 0.75rem; }
      .btn {
        width: 100%;
        padding: 0.65rem 1rem;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-primary {
        background: #1d4ed8;
        color: #fff;
      }
      .btn-primary:hover { background: #2563eb; }
      .btn-secondary {
        background: #1e1e2e;
        color: #94a3b8;
      }
      .btn-secondary:hover { background: #27273a; color: #e2e8f0; }
      .btn-text {
        background: none;
        color: #64748b;
        font-size: 0.8rem;
      }
      .btn-text:hover { color: #94a3b8; }

      .footer {
        margin-top: 2rem;
        font-size: 0.7rem;
        color: #3f3f46;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="shield">&#x1F6E1;</div>
      <div id="badge" class="badge badge-default">THREAT</div>
      <h1 id="title">Dangerous Site Blocked</h1>
      <p id="description" class="description">
        PhishScamSense has detected that this website is a potential threat
        and has blocked access to protect you.
      </p>

      <div class="details">
        <div class="details-row">
          <span class="details-label">Blocked URL</span>
          <span id="detail-url" class="details-value">—</span>
        </div>
        <div class="details-row">
          <span class="details-label">Threat Type</span>
          <span id="detail-threat" class="details-value">—</span>
        </div>
        <div class="details-row">
          <span class="details-label">Confidence</span>
          <span id="detail-confidence" class="details-value">—</span>
        </div>
        <div class="confidence-bar-bg">
          <div id="confidence-bar" class="confidence-bar confidence-high" style="width: 0%"></div>
        </div>
      </div>

      <div class="buttons">
        <button id="back-btn" class="btn btn-primary">Go Back to Safety</button>
        <button id="report-btn" class="btn btn-text">Report as False Positive</button>
      </div>

      <p class="footer">Protected by PhishScamSense</p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const blockedUrl = params.get("url") || "";
      const threat = params.get("threat") || "unknown";
      const confidence = parseFloat(params.get("confidence") || "0");

      const detailUrl = document.getElementById("detail-url");
      const detailThreat = document.getElementById("detail-threat");
      const detailConfidence = document.getElementById("detail-confidence");
      const confidenceBar = document.getElementById("confidence-bar");
      const badge = document.getElementById("badge");

      if (detailUrl) detailUrl.textContent = blockedUrl || "Unknown";
      if (detailThreat) detailThreat.textContent = threat.charAt(0).toUpperCase() + threat.slice(1);
      if (detailConfidence) detailConfidence.textContent = Math.round(confidence * 100) + "%";

      if (confidenceBar) {
        confidenceBar.style.width = Math.round(confidence * 100) + "%";
        if (confidence >= 0.7) confidenceBar.className = "confidence-bar confidence-high";
        else if (confidence >= 0.4) confidenceBar.className = "confidence-bar confidence-mid";
        else confidenceBar.className = "confidence-bar confidence-low";
      }

      if (badge) {
        const badgeMap = { phishing: "badge-phishing", malware: "badge-malware", spam: "badge-spam" };
        badge.className = "badge " + (badgeMap[threat] || "badge-default");
        badge.textContent = threat.toUpperCase();
      }

      document.getElementById("back-btn").addEventListener("click", () => {
        chrome.tabs.getCurrent((tab) => {
          chrome.tabs.update(tab.id, { url: "chrome://newtab" });
        });
      });

      document.getElementById("report-btn").addEventListener("click", async () => {
        const btn = document.getElementById("report-btn");
        btn.disabled = true;
        btn.textContent = "Submitting\u2026";

        try {
          const stored = await chrome.storage.local.get("apiBase");
          const apiBase = stored.apiBase || "http://localhost:8000";

          const response = await fetch(apiBase + "/api/v1/reports/false-positive", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: blockedUrl, comments: "" }),
          });

          if (!response.ok) throw new Error("Server returned " + response.status);

          btn.textContent = "Report Submitted \u2014 Thank you!";
          btn.style.color = "#22c55e";
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Could not submit report. Is the backend running?";
          btn.style.color = "#ef4444";
          setTimeout(() => {
            btn.textContent = "Report as False Positive";
            btn.style.color = "";
          }, 3000);
        }
      });
    </script>
  </body>
</html>
