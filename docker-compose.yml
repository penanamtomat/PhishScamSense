version: "3.8"

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: phishsense-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: phishsense-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishsense-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - rabbitmq
    volumes:
      - ./backend:/app

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishsense-celery
    command: celery -A app.workers.celery_app worker --loglevel=info -Q investigation,training
    env_file:
      - ./backend/.env
    depends_on:
      - rabbitmq

  # BentoML Inference Service
  bentoml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: phishsense-bentoml
    ports:
      - "3000:3000"
    volumes:
      - ./ml:/app

volumes:
  rabbitmq_data:
  mlflow_data:
